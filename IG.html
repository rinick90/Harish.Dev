<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        main {
            /* border: 1px solid red; */
            height: 90vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
        }

        footer {
            border: 1px solid black;
            height: 10vh;
        }

        .right {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            font-size: 30px;
        }

        .left {
            /* border: 2px solid yellow; */
            display: grid;
            grid-template-columns: 1fr 2fr;
        }

        

        .logo img {
            /* border: 1px solid; */
            height: 10%;
            width: 20%;
            margin-top: 30px;
            margin-left: 15px;
        }

        .img-tag {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 40px;

        }

        .img-tag img {
            /* border: 1px solid blue; */
            height: 60%;
            width: 80%;
            /* margin-left: 20%; */

        }

        .img-tag h1 {
            /* border: 1px solid black; */
            font-size: 55px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            width: 65%;
            text-align: center;
            margin-left: 55px;
            margin-top: 15%;
            line-height: 60px;


        }

        .right h4 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            
        
        }

        .login {
            /* border: 1px solid; */
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 30px;
        }
        .login input {
            padding: 16px;
            border-radius: 10px;
            border: 1px solid gray;
        }

        .login input :hover {
            border: 1px solid white;
        }

        .login button {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;

        }

        .lgn-bt {
            border: none;
            color: white;
            background-color: rgb(53, 53, 157);
        }

        .fg-bt {
            border: none;
            background-color: white;
            color: black;

        }
            
        .fg-bt:hover {  
            background-color: gainsboro;
            border: 1px solid;
        }

        .cna-bt {
            border: 1px solid rgb(53, 53, 157);
            background-color: white;
            color: rgb(53, 53, 157);
        }
        .lfb-bt{
            border: none;
            color: white;
            background-color: rgb(53, 53, 157);
            

        }


        .cna-bt:hover {
            background-color: gainsboro;
            border: 1px solid;
        }

        ul{
            /* border: 2px solid rgb(113, 95, 95); */
            display: flex;
            gap: 20px;
            list-style-type: none;
            justify-content: center;
            line-height: 25px;
        }
        a{
            text-decoration: none;
            color: grey;
        }

    </style>
</head>

<body>
    <main>
        <div class="left">
            <div class="logo"> <img
                    src="https://img.magnific.com/free-psd/instagram-application-logo_23-2151544090.jpg?semt=ais_hybrid&w=740&q=80"
                    alt=""></div>

            <div class="img-tag">
                <h1>See everyday moments from your close friends.</h1><img
                    src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" alt="">

            </div>
        </div>
        <div class="right">
            <div class="login">
                <h4>Log in to Instagram</h4>
                <input type="text" placeholder="email or phone number">
                <input type="text" placeholder="password">
                <button class="lgn-bt">login</button>
                <button class="fg-bt">forget password?</button>
                <button class="lfb-bt">login with facebook</button>
                <button class="cna-bt">create new account</button>
            </div>
        </div>
    </main>

    <footer>
        <ul>
            <list><a href="">Meta</a></list>
            <list><a href="">About</a></list>
            <list><a href="">Blog</a></list>
            <list><a href="">Jobs</a></list>
            <list><a href="">Help</a></list>
            <list><a href="">Privacy</a></list>
            <list><a href="">Terms</a></list>
            <list><a href="">Locations</a></list>
            <list><a href="">Popular</a></list>
            <list><a href="">Instagram Lite</a></list>
            <li><a href="">Meta Verified</a></li>
            <list><a href="">© 2026 Instagram from Meta</a></list>
        </ul>
        <ul>
            <list><a href="">Jobs</a></list>
            <list><a href="">Help</a></list>
            <list><a href="">Privacy</a></list>
            <list><a href="">Terms</a></list>
            <list><a href="">Locations</a></list>
            <list><a href="">Popular</a></list>
            
        </ul>

    </footer>

</body>

</html>
