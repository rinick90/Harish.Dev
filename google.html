<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1fb530979b.js" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        header {
            /* border: 1px solid blue; */
            display: flex;
            justify-content: space-between;
            margin: 20px 40px;
            font-weight: bold;
        }

        .left {
            /* border: 1px solid green; */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;

        }

        .right {
            /* border: 1px solid purple; */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;



        }

        .Menu {
            border-radius: 50%;
            width: 40px;
        }

        .user {
            border-radius: 50%;
            width: 40px;
        }

        a {
            text-decoration: none;
            color: black;
            transition: text-decoration;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo {
            width: 600px;
        }

        .searchbar {
            box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
            /* border: 1px solid; */
            width: fit-content;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 50px;
        }

        .searchbar input{
            width: 500px;
            padding: 10px;
            font-size: 22px;
            border: none;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-bottom: 100px;
            gap: 40px;
        }
        footer{
            /* border: 1px solid; */
            margin-top: 225px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }
        /* a{
            border: 1px solid;
            padding: 10px,50px;
        } */

        
        
    </style>
</head>

<body>
    <header>
        <div class="left">
            <a href="">About</a>
            <a href="">Store</a>
        </div>
        <div class="right">
            <a href="">Gmail</a>
            <a href="">Image</a>
            <img class="Menu" src="https://ssl.gstatic.com/gb/images/bar/al-icon.png" alt="">
            <img class="user"
                src="https://img.magnific.com/free-vector/user-circles-set_78370-4704.jpg?semt=ais_hybrid&w=740&q=80"
                alt="">
        </div>
    </header>
    <main>
        <img class="logo"
            src="https://storage.googleapis.com/gd-prod/images/f4f4bc5f-904a-4b61-972f-c403bc060679.60c498c559810aa0.webp"
            alt="">
        <div class="searchbar">
            <i class="fa-solid fa-plus"></i>
            <input type="text">
            <i class="fa-solid fa-microphone-lines"></i>
            <i class="fa-solid fa-camera"></i>
            <span class="ai">
                <i class="fa-solid fa-magnifying-glass"></i>
                AI Mode
            </span>
        </div>
        <div.>
        <button>Google</button>
        <button>Create Image</button>
        </div>


    </main>
    <footer>
        <div class="dleft">
            <a href="">Advertising</a>
            <a href="">explore</a>
            <a href="">Buisness</a>
            
            

        </div>
        <div class="dright">
            <a href="">Privacy</a>
            <a href="">Term</a>
            <a href="">Settings</a>
        </div>

    </footer>

</body>

</html>
